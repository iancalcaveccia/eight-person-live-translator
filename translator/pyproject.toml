[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-live-translator"
version = "0.1.0"
description = "LiveKit Agents worker: streaming speech-to-speech interpretation (Gemini Live Translate primary, OpenAI gpt-realtime-translate optional)"
requires-python = ">=3.10, <3.15"

# Providers are spoken to over raw WebSockets (see src/providers/), so no
# vendor SDK is required. numpy/aiohttp/websockets are imported directly.
dependencies = [
    "livekit-agents~=1.5",
    "python-dotenv",
    "numpy>=1.26",
    "aiohttp>=3.10",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The local livekit-server --dev secret ("secret") is short by design.
filterwarnings = ["ignore:The HMAC key is"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
